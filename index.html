const fT=m=>{if(m>=999)return"n/a";if(m<60)return`${m}m`;const h=Math.floor(m/60),r=m%60;return r?`${h}h${r}m`:`${h}h`;};
const mC=d=>{let t=0;if(d.trn<999)t=0;else if(d.fl)t=Math.min(...d.fl.ap.map(a=>a.pr[0]))*2+10;else if(d.fx)t=d.fx.pr[0]*2;return t+10;};
const mT=d=>{let a=[];if(d.trn<999)a.push(d.trn);if(d.car<900)a.push(d.car);if(d.fl)a.push(Math.min(...d.fl.ap.map(x=>x.min))+120);if(d.fx)a.push(d.fx.min);return a.length?Math.min(...a):999;};
const dKm=(a,b)=>{const R=6371,dL=(b[0]-a[0])*Math.PI/180,dN=(b[1]-a[1])*Math.PI/180,x=Math.sin(dL/2)**2+Math.cos(a[0]*Math.PI/180)*Math.cos(b[0]*Math.PI/180)*Math.sin(dN/2)**2;return Math.round(R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))*1.3);};

const SORTS=[{k:"name",l:"A–Z"},{k:"distance",l:"Distance"},{k:"cheapest",l:"Cheapest"},{k:"fastest",l:"Fastest"}];

function B({children,color,bg,t}){return<span style={{background:bg||t.ab,color:color||t.ac,fontSize:18,padding:"4px 6px",borderRadius:13,fontWeight:700,letterSpacing:.3,textTransform:"uppercase",whiteSpace:"nowrap"}}>{children}</span>}
function R({label,value,bold,hl,sub,t}){return<div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"12px 0",fontSize:18}}><span style={{color:bold?t.tx:t.tm,fontWeight:bold?600:400}}>{label}{sub&&<span style={{display:"block",fontSize:19,color:t.td,fontWeight:400}}>{sub}</span>}</span><span style={{color:hl?t.tl:bold?t.w:t.tx,fontWeight:bold||hl?700:500}}>{value}</span></div>}

function TripPlanner(){
  const[theme,setTheme]=useState("dark");
  const[selId,setSelId]=useState(null);
  const[transport,setTr]=useState(null);
  const[selFl,setSelFl]=useState(null);
  const[catF,setCatF]=useState("all");
  const[distF,setDistF]=useState("all");
  const[sortBy,setSortBy]=useState("name");
  const[search,setSearch]=useState("");
  const[people,setPeople]=useState(1);
  const[nights,setNights]=useState(0);
  const[wantWell,setWantWell]=useState(null);
  const[meal,setMeal]=useState(25);
  const[step,setStep]=useState(0);
  const[cmpIds,setCmpIds]=useState([]);
  const[showCmp,setShowCmp]=useState(false);
  const[selAt,setSelAt]=useState([]);
  const[wantLoc,setWantLoc]=useState(false);
  const[copied,setCopied]=useState(false);
  const[s2Id,setS2Id]=useState(null);
  const[s2Nt,setS2Nt]=useState(0);
  const[s2Well,setS2Well]=useState(false);
  const[s2At,setS2At]=useState([]);
  const[s2Loc,setS2Loc]=useState(false);
  const[showS2,setShowS2]=useState(false);

  const t=TH[theme];
  const dest=D.find(d=>d.id===selId);
  const stop2=D.find(d=>d.id===s2Id)||null;
  const multi=!!stop2;
  const totalNt=nights+(multi?s2Nt:0);
  const totalDays=totalNt+1;

  const filtered=useMemo(()=>{
    let l=[...D];
    if(search.trim()){const s=search.toLowerCase();l=l.filter(d=>d.nm.toLowerCase().includes(s)||d.co.toLowerCase().includes(s)||d.ds.toLowerCase().includes(s));}
    if(catF==="flight")l=l.filter(d=>d.fl!==null);
    else if(catF!=="all")l=l.filter(d=>d.cat===catF);
    if(distF==="near")l=l.filter(d=>d.km<100);
    if(distF==="mid")l=l.filter(d=>d.km>=100&&d.km<=300);
    if(distF==="far")l=l.filter(d=>d.km>300);
    if(sortBy==="distance")l.sort((a,b)=>a.km-b.km);
    else if(sortBy==="cheapest")l.sort((a,b)=>mC(a)-mC(b));
    else if(sortBy==="fastest")l.sort((a,b)=>mT(a)-mT(b));
    else l.sort((a,b)=>a.nm.localeCompare(b.nm));
    return l;
  },[catF,distF,sortBy,search]);

  const s2Near=useMemo(()=>{
    if(!dest)return[];
    return D.filter(d=>d.id!==dest.id&&(d.car<900||d.trn<999)&&dKm(dest.ll,d.ll)<400).sort((a,b)=>dKm(dest.ll,a.ll)-dKm(dest.ll,b.ll));
  },[dest]);

  const interKm=useMemo(()=>dest&&stop2?dKm(dest.ll,stop2.ll):0,[dest,stop2]);
  const interMin=useMemo(()=>transport&&interKm?dMin(interKm,transport):0,[transport,interKm]);

  const trvMin=useMemo(()=>{
    if(!dest||!transport)return 0;
    if(transport==="train")return dest.trn;
    if(transport==="car")return dest.car;
    if(transport==="flight"&&selFl)return selFl.min+120;
    if(transport==="flixbus"&&dest.fx)return dest.fx.min;
    return 0;
  },[dest,transport,selFl]);

  const retMin=useMemo(()=>{
    if(!transport)return 0;
    if(!multi)return trvMin;
    if(transport==="train")return stop2.trn<999?stop2.trn:Math.round(stop2.km/70*60);
    if(transport==="car")return stop2.car<900?stop2.car:Math.round(stop2.km/80*60);
    if(transport==="flixbus")return stop2.fx?stop2.fx.min:Math.round(stop2.km/60*60);
    return trvMin;
  },[transport,multi,stop2,trvMin]);

  const recNights=useMemo(()=>{const tot=trvMin+(multi?interMin+retMin:0);return tot>300?2:tot>180?1:0;},[trvMin,multi,interMin,retMin]);

  const costs=useMemo(()=>{
    if(!dest||!transport)return null;
    let trT=0,flC=0,fuel=0,toll=0,park=0,aptT=0,fxC=0,trnC=0;
    if(transport==="train"){
      if(multi){
        const l1=dest.trp?(dest.trp[0]+dest.trp[1])/2:0;
        const li=Math.round(interKm*0.08);
        const l3=stop2.trp?(stop2.trp[0]+stop2.trp[1])/2:0;
        trnC=(l1+li+l3)*people;
      }else if(dest.trp){
        const avg=(dest.trp[0]+dest.trp[1])/2;trnC=avg*2*people;
      }
      trT=trnC;
    }else if(transport==="car"){
      const routeKm=multi?dest.km+interKm+stop2.km:dest.km*2;
      fuel=routeKm*FUEL;toll=dest.toll+(multi?stop2.toll:0);park=dest.pk+(multi?stop2.pk:0);trT=fuel+toll+park;
    }else if(transport==="flight"&&selFl){
      const avg=(selFl.pr[0]+selFl.pr[1])/2;flC=avg*2*people;aptT=(selFl.cd.startsWith("BTS")?AB:AV)*2;trT=flC+aptT;
    }else if(transport==="flixbus"){
      if(multi){
        const l1=dest.fx?(dest.fx.pr[0]+dest.fx.pr[1])/2:15;
        const li=Math.round(interKm*0.06);
        const l3=stop2.fx?(stop2.fx.pr[0]+stop2.fx.pr[1])/2:15;
        fxC=(l1+li+l3)*people;
      }else if(dest.fx){
        const avg=(dest.fx.pr[0]+dest.fx.pr[1])/2;fxC=avg*2*people;
      }
      trT=fxC;
    }
    const htl=dest.htl*nights+(multi?stop2.htl*s2Nt:0);
    const well=(wantWell?dest.well*people:0)+(multi&&s2Well?stop2.well*people:0);
    const mls=meal*people*totalDays;
    const atC=selAt.reduce((s,i)=>s+(dest.at[i]?.p||0),0)*people;
    const at2C=multi?s2At.reduce((s,i)=>s+(stop2.at[i]?.p||0),0)*people:0;
    const d1Days=Math.max(1,nights);const d2Days=multi?Math.max(1,s2Nt):0;
    const locC=(wantLoc&&dest.loc)?dest.loc.p*people*d1Days:0;
    const loc2C=(multi&&s2Loc&&stop2.loc)?stop2.loc.p*people*d2Days:0;
    const routeKm=transport==="car"?(multi?dest.km+interKm+stop2.km:dest.km*2):0;
    return{trT,trnC,flC,fuel,toll,park,aptT,fxC,htl,well,mls,atC,at2C,locC,loc2C,routeKm,total:trT+htl+well+mls+atC+at2C+locC+loc2C};
  },[dest,transport,selFl,nights,wantWell,meal,people,totalDays,selAt,wantLoc,multi,stop2,s2Nt,s2Well,s2At,s2Loc,interKm]);

  const tlSegs=useMemo(()=>{
    if(!dest||!transport||step<4)return[];
    const ti=transport==="train"?"🚂":transport==="car"?"🚗":transport==="flixbus"?"🚌":"✈️";
    const sn=n=>n.length>9?n.split(" ")[0]:n;
    const s=[{icon:"🏠",lb:"Vienna",sub:"Depart"},{icon:ti,lb:fT(trvMin),sub:"Travel"},{icon:dest.em,lb:sn(dest.nm),sub:"Arrive"}];
    const d1=Math.max(1,nights);s.push({icon:"☀️",lb:d1>1?`${d1}d`:"Explore",sub:d1>1?"Explore":"Full day"});
    if(nights>0)s.push({icon:"🏨",lb:`${nights}nt`,sub:fE(dest.htl*nights)});
    if(multi){
      s.push({icon:"🔗",lb:fT(interMin),sub:`${interKm}km`});
      s.push({icon:stop2.em,lb:sn(stop2.nm),sub:"Stop 2"});
      const d2=Math.max(1,s2Nt);s.push({icon:"☀️",lb:d2>1?`${d2}d`:"Explore",sub:d2>1?"Explore":"Full day"});
      if(s2Nt>0)s.push({icon:"🏨",lb:`${s2Nt}nt`,sub:fE(stop2.htl*s2Nt)});
      s.push({icon:ti,lb:fT(retMin),sub:"Return"});
    }else{
      s.push({icon:ti,lb:fT(trvMin),sub:"Return"});
    }
    s.push({icon:"🏠",lb:"Vienna",sub:"Home"});
    return s;
  },[dest,transport,trvMin,step,nights,multi,stop2,s2Nt,interMin,interKm,retMin]);

  const resetS2=()=>{setS2Id(null);setS2Nt(0);setS2Well(false);setS2At([]);setS2Loc(false);setShowS2(false);};
  const reset=()=>{setSelId(null);setTr(null);setSelFl(null);setWantWell(null);setNights(0);setSelAt([]);setWantLoc(false);setStep(0);setCopied(false);resetS2();};
  const pick=id=>{setSelId(id);setTr(null);setSelFl(null);setWantWell(null);setNights(0);setSelAt([]);setWantLoc(false);setStep(1);setCopied(false);resetS2();};
  const pickTr=(tp,fl)=>{setTr(tp);setSelFl(fl||null);setStep(2);};
  const pickNights=n=>{setNights(n);setStep(3);};
  const pickWell=v=>{setWantWell(v);setStep(4);};
  const applyPreset=p=>{setMeal(p.ml);setWantWell(p.well);const n=Math.max(p.nts,recNights);if(multi){const h=Math.floor(n/2);setNights(n-h);setS2Nt(h);}else setNights(n);setSelAt([]);setWantLoc(false);setS2At([]);setS2Loc(false);setStep(4);};
  const togCmp=id=>setCmpIds(p=>p.includes(id)?p.filter(x=>x!==id):p.length<3?[...p,id]:p);
  const togAt=i=>setSelAt(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);
  const togS2At=i=>setS2At(p=>p.includes(i)?p.filter(x=>x!==i):[...p,i]);
  const surprise=()=>{const pool=filtered.length?filtered:D;const rd=pool[Math.floor(Math.random()*pool.length)];const pr=PRESETS[Math.floor(Math.random()*PRESETS.length)];const best=rd.trn<999?"train":rd.fx?"flixbus":rd.fl?"flight":rd.car<900?"car":null;if(!best)return;const fl=best==="flight"?rd.fl.ap[0]:null;const tm=best==="train"?rd.trn:best==="car"?rd.car:best==="flixbus"?rd.fx.min:fl?(fl.min+120):0;const rN=tm>300?2:tm>180?1:0;setSelId(rd.id);setTr(best);setSelFl(fl);setMeal(pr.ml);setWantWell(pr.well);setNights(Math.max(pr.nts,rN));setSelAt([]);setWantLoc(false);setStep(4);setCopied(false);resetS2();};

  const buildText=useCallback(()=>{
    if(!dest||!costs)return"";
    const ln=[`🗺️ ${multi?`Multi-stop: ${dest.nm} → ${stop2.nm}`:`Trip: ${dest.nm}`} • ${totalDays}d/${totalNt}nt`,`👥 ${people} person${people>1?"s":""}`,``,
      `🚃 ${transport==="train"?`Train tickets ~${fE(costs.trnC)}${dest.trp?` (€${dest.trp[0]}–${dest.trp[1]} one-way)`:""}`:transport==="car"?`Car ~${fE(costs.fuel)} (${costs.routeKm}km${multi?" total route":""})`:transport==="flight"?`${selFl.cd} ${selFl.al} (~${fE(costs.flC)})`:transport==="flixbus"?`FlixBus (~${fE(costs.fxC)})`:""}`];
    if(transport==="car"&&costs.toll>0)ln.push(`  Tolls: ${fE(costs.toll)} • Parking: ${fE(costs.park)}`);
    if(multi)ln.push(`🔗 ${dest.nm} → ${stop2.nm}: ~${interKm}km (${fT(interMin)})`);
    if(nights>0)ln.push(`🏨 ${dest.nm}: ${nights}nt ~${fE(dest.htl*nights)}`);
    if(multi&&s2Nt>0)ln.push(`🏨 ${stop2.nm}: ${s2Nt}nt ~${fE(stop2.htl*s2Nt)}`);
    if(wantWell)ln.push(`🧖 Wellness ${dest.nm}: ${fE(dest.well*people)}`);
    if(multi&&s2Well)ln.push(`🧖 Wellness ${stop2.nm}: ${fE(stop2.well*people)}`);
    ln.push(`🍽️ Meals: ${fE(meal)}/pp×${totalDays}d = ${fE(costs.mls)}`);
    if(costs.atC>0)ln.push(`🎫 ${dest.nm}: ${selAt.map(i=>`${dest.at[i].n} €${dest.at[i].p}`).join(", ")} = ${fE(costs.atC)}`);
    if(multi&&costs.at2C>0)ln.push(`🎫 ${stop2.nm}: ${s2At.map(i=>`${stop2.at[i].n} €${stop2.at[i].p}`).join(", ")} = ${fE(costs.at2C)}`);
    if(costs.locC>0)ln.push(`🚇 ${dest.loc.n} ${fE(costs.locC)}`);
    if(multi&&costs.loc2C>0)ln.push(`🚇 ${stop2.loc.n} ${fE(costs.loc2C)}`);
    ln.push(``,`💰 TOTAL: ~${fE(costs.total)}${people>1?` (${fE(costs.total/people)}/pp)`:""}`);
    const cur=NE[dest.co];if(cur)ln.push(`💱 ${cur.c} (${cur.r})`);
    if(multi){const c2=NE[stop2.co];if(c2&&c2.c!==(cur?.c))ln.push(`💱 ${c2.c} (${c2.r})`);}
    ln.push(``,`📋 ${dest.nm}:`,`☀️ ${dest.it.am}`,`🌤️ ${dest.it.pm}`,`🌙 ${dest.it.ev}`);
    if(multi)ln.push(``,`📋 ${stop2.nm}:`,`☀️ ${stop2.it.am}`,`🌤️ ${stop2.it.pm}`,`🌙 ${stop2.it.ev}`);
    return ln.join("\n");
  },[dest,costs,transport,selFl,nights,wantWell,meal,people,totalDays,totalNt,selAt,wantLoc,multi,stop2,s2Nt,s2Well,s2At,s2Loc,interKm,interMin]);

  const doExport=useCallback(()=>{
    const txt=buildText();if(!txt)return;
    navigator.clipboard.writeText(txt).then(()=>{setCopied(true);setTimeout(()=>setCopied(false),2000);}).catch(()=>{});
  },[buildText]);

  const doTelegram=useCallback(()=>{
    const txt=buildText();if(!txt)return;
    const appUrl="https://rizabalci.github.io/vienna-trip-planner/";
    const url=`https://t.me/share/url?url=${encodeURIComponent(appUrl)}&text=${encodeURIComponent(txt)}`;
    window.open(url,"_blank");
  },[buildText]);

  const bs={cursor:"pointer",textAlign:"left",color:t.tx,transition:"all 0.15s"};

  if(showCmp&&cmpIds.length>=2){
    const cDs=cmpIds.map(id=>D.find(d=>d.id===id)).filter(Boolean);
    return(
      <div style={{minHeight:"100vh",background:t.bg,fontFamily:"-apple-system,'Segoe UI',sans-serif",color:t.tx,padding:"28px 16px 48px"}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
            <h2 style={{margin:0,fontSize:32,color:t.w}}>⚖️ Compare</h2>
            <button onClick={()=>setShowCmp(false)} style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"10px 14px",color:t.tm,cursor:"pointer",fontSize:32}}>← Back</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:`repeat(${cDs.length},1fr)`,gap:12}}>
            {cDs.map(d=>{const cur=NE[d.co];const cf=d.fl?Math.min(...d.fl.ap.map(a=>a.pr[0])):null;return(
              <div key={d.id} style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:18}}>
                <div style={{textAlign:"center",marginBottom:14}}><span style={{fontSize:32}}>{d.em}</span><h3 style={{margin:"5px 0 2px",fontSize:18,color:t.w}}>{d.nm}</h3><div style={{fontSize:32,color:t.tm}}>{d.co}•{d.km}km</div></div>
                <div style={{borderTop:`1px solid ${t.cb}`,paddingTop:8}}>
                  {[["🚂",d.trn<999?`${fT(d.trn)} FREE`:"—"],["🚗",d.car<900?`${fT(d.car)} ~${fE(d.km*2*FUEL)}`:"—"],["🚌",d.fx?`${fT(d.fx.min)} €${d.fx.pr[0]}–${d.fx.pr[1]}`:"—"],["✈️",cf?`from €${cf}`:"—"],["🏨",fE(d.htl)+"/nt"],["🧖",d.well?fE(d.well):"—"],["🎫",d.at[0]?`${d.at[0].n} ${d.at[0].p?fE(d.at[0].p):"free"}`:"—"],["💱",cur?cur.c:"EUR ✓"],["📅",d.mo]].map(([l,v],i)=>
                    <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"12px 0",fontSize:19,borderBottom:i<8?`1px solid ${t.cb}`:"none"}}><span style={{color:t.tm}}>{l}</span><span style={{color:t.tx,fontWeight:500,textAlign:"right",maxWidth:"60%"}}>{v}</span></div>
                  )}
                </div>
                <div style={{marginTop:8,textAlign:"center"}}><button onClick={()=>{setShowCmp(false);pick(d.id);}} style={{background:t.ab,border:`1px solid ${t.ac}`,borderRadius:13,padding:"12px 14px",color:t.ac,cursor:"pointer",fontSize:19,fontWeight:600}}>Plan →</button></div>
              </div>
            );})}
          </div>
        </div>
      </div>
    );
  }

  return(
    <div style={{minHeight:"100vh",background:t.bg,fontFamily:"-apple-system,'Segoe UI',sans-serif",color:t.tx,position:"relative",overflow:"hidden"}}>
      <style>{`@keyframes tlSweep{0%{background-position:200% 0}100%{background-position:-200% 0}}@keyframes tlPop{0%,100%{transform:scale(1);opacity:0.85}50%{transform:scale(1.18);opacity:1}}@keyframes tlGlow{0%,100%{box-shadow:0 0 4px ${t.ac}40}50%{box-shadow:0 0 12px ${t.ac}80}}`}</style>
      <div style={{position:"absolute",top:-100,right:-100,width:350,height:350,borderRadius:"50%",background:`radial-gradient(circle,${t.g1} 0%,transparent 70%)`,pointerEvents:"none"}}/>
      <div style={{position:"absolute",bottom:-140,left:-80,width:420,height:420,borderRadius:"50%",background:`radial-gradient(circle,${t.g2} 0%,transparent 70%)`,pointerEvents:"none"}}/>

      <div style={{maxWidth:740,margin:"0 auto",padding:"24px 16px 48px",position:"relative",zIndex:1}}>
        <div style={{textAlign:"center",marginBottom:16}}>
          <div style={{display:"flex",justifyContent:"flex-end",marginBottom:14}}>
            <button onClick={()=>setTheme(theme==="dark"?"light":"dark")} style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:13,padding:"12px 9px",color:t.tm,cursor:"pointer",fontSize:19}}>{theme==="dark"?"☀️ Light":"🌙 Dark"}</button>
          </div>
          <div style={{fontSize:19,letterSpacing:5,textTransform:"uppercase",color:t.ac,marginBottom:4,fontWeight:600}}>Vienna Day Trip</div>
          <h1 style={{margin:0,fontSize:32,fontWeight:700,color:t.w}}>Trip Planner ✈️</h1>
          <p style={{margin:"4px 0",fontSize:32,color:t.tm}}>🚂 Train • 🚗 Car • 🚌 FlixBus • ✈️ Flights • 🔗 Multi-stop</p>
        </div>

        {step===0&&(
          <div>
            <div style={{background:t.db,border:`1px solid ${t.dn}20`,borderRadius:13,padding:"11px 11px",marginBottom:14,fontSize:18,color:t.dn,lineHeight:1.5}}>⚠️ <strong>2026:</strong> Wizzair closed VIE. Ryanair cut routes. Cheap flights → <strong>BTS</strong> Bratislava.</div>
            <div style={{marginBottom:12}}>
              <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 Search destinations..." style={{width:"100%",boxSizing:"border-box",background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"12px 12px",color:t.tx,fontSize:18,outline:"none"}}/>
            </div>
            <div style={{textAlign:"center",marginBottom:12}}>
              <button onClick={surprise} style={{background:`linear-gradient(135deg,${t.ac}18,${t.tl}18)`,border:`1px solid ${t.ac}30`,borderRadius:20,padding:"10px 18px",color:t.ac,cursor:"pointer",fontSize:32,fontWeight:600,letterSpacing:0.5}}>🎲 Surprise Me!</button>
            </div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center",marginBottom:12}}>
              {CATS.map(c=><button key={c.k} onClick={()=>setCatF(c.k)} style={{background:catF===c.k?t.ab:t.cd,border:`1px solid ${catF===c.k?t.ac:t.cb}`,borderRadius:14,padding:"4px 9px",color:catF===c.k?t.ac:t.tm,cursor:"pointer",fontSize:19,fontWeight:500}}>{c.i} {c.l}</button>)}
            </div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center",marginBottom:12}}>
              {DISTS.map(d=><button key={d.k} onClick={()=>setDistF(d.k)} style={{background:distF===d.k?t.tb:t.cd,border:`1px solid ${distF===d.k?t.tl:t.cb}`,borderRadius:14,padding:"4px 8px",color:distF===d.k?t.tl:t.td,cursor:"pointer",fontSize:18}}>{d.l}</button>)}
            </div>
            <div style={{display:"flex",gap:12,flexWrap:"wrap",justifyContent:"center",marginBottom:14}}>
              <span style={{fontSize:18,color:t.td,lineHeight:"20px"}}>Sort:</span>
              {SORTS.map(s=><button key={s.k} onClick={()=>setSortBy(s.k)} style={{background:sortBy===s.k?`${t.bl}12`:"transparent",border:`1px solid ${sortBy===s.k?`${t.bl}35`:t.cb}`,borderRadius:13,padding:"4px 7px",color:sortBy===s.k?t.bl:t.td,cursor:"pointer",fontSize:18}}>{s.l}</button>)}
            </div>
            {cmpIds.length>0&&(
              <div style={{background:`${t.bl}08`,border:`1px solid ${t.bl}20`,borderRadius:13,padding:"10px 10px",marginBottom:14,display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:12}}>
                <div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap"}}>
                  <span style={{fontSize:19,color:t.bl,fontWeight:600}}>⚖️</span>

                </div>

            </div>
            {filtered.length===0&&<div style={{textAlign:"center",padding:36,color:t.td,fontSize:18}}>No matches.</div>}

        {step>=1&&dest&&(

              <div style={{display:"flex",alignItems:"center",gap:10}}>
                <span style={{fontSize:32}}>{dest.em}</span>

                </div>
              </div>
              {NE[dest.co]&&<div style={{marginTop:8,background:t.ab,borderRadius:13,padding:"12px 9px",fontSize:18,color:t.ac,lineHeight:1.4}}>💱 <strong>{NE[dest.co].c}</strong> — {NE[dest.co].r} — {NE[dest.co].tip}</div>}
              {multi&&NE[stop2.co]&&NE[stop2.co].c!==NE[dest.co]?.c&&<div style={{marginTop:4,background:t.ab,borderRadius:13,padding:"12px 9px",fontSize:18,color:t.ac,lineHeight:1.4}}>💱 <strong>{NE[stop2.co].c}</strong> — {NE[stop2.co].r} — {NE[stop2.co].tip}</div>}

            <div style={{marginBottom:14}}>
              <div style={{fontSize:18,color:t.tm,textAlign:"center",marginBottom:12}}>⚡ Quick presets</div>

                {PRESETS.map(p=><button key={p.k} onClick={()=>applyPreset(p)} style={{...bs,background:p.bg,border:`1px solid ${p.c}30`,borderRadius:14,padding:"12px 6px",textAlign:"center"}}>
                  <div style={{fontWeight:700,fontSize:32,color:p.c}}>{p.l}</div>
                  <div style={{fontSize:8,color:t.tm,marginTop:2}}>{p.desc}</div>

            {step>=1&&(

                <div style={{display:"grid",gridTemplateColumns:`repeat(${[dest.trn<999,dest.car<900,!!dest.fx,!!dest.fl].filter(Boolean).length},1fr)`,gap:10}}>
                  {dest.trn<999&&<button onClick={()=>pickTr("train")} style={{...bs,background:transport==="train"?t.tb:t.cd,border:transport==="train"?`2px solid ${t.tl}`:`1px solid ${t.cb}`,borderRadius:13,padding:18}}><div style={{fontSize:19}}>🚂</div><div style={{fontWeight:700,fontSize:32,color:t.w}}>Train</div><div style={{fontSize:19,color:t.ac,fontWeight:700}}>{dest.trp?`€${dest.trp[0]}–${dest.trp[1]}`:"—"}</div><div style={{fontSize:8,color:t.td}}>one-way ticket</div><div style={{fontSize:18,color:t.tm,marginTop:3}}>⏱{fT(dest.trn)}</div></button>}
                  {dest.car<900&&<button onClick={()=>pickTr("car")} style={{...bs,background:transport==="car"?t.ab:t.cd,border:transport==="car"?`2px solid ${t.ac}`:`1px solid ${t.cb}`,borderRadius:13,padding:18}}><div style={{fontSize:19}}>🚗</div><div style={{fontWeight:700,fontSize:32,color:t.w}}>Car</div><div style={{fontSize:19,color:t.ac,fontWeight:700}}>~{fE(dest.km*2*FUEL)}</div><div style={{fontSize:8,color:t.td}}>fuel+park</div><div style={{fontSize:18,color:t.tm,marginTop:3}}>⏱{fT(dest.car)}</div></button>}

                  {dest.fl&&(

                      {dest.fl.ap.map((ap,i)=><button key={i} onClick={()=>pickTr("flight",ap)} style={{display:"block",width:"100%",textAlign:"left",marginBottom:3,background:selFl===ap?`${t.bl}10`:t.cd,border:selFl===ap?`1px solid ${t.bl}35`:`1px solid ${t.cb}`,borderRadius:13,padding:"12px 7px",cursor:"pointer",color:t.tx}}><div style={{fontSize:18,fontWeight:600,color:ap.al==="Ryanair"?t.bl:t.pu}}>{ap.al}</div><div style={{fontSize:8,color:t.tm}}>{ap.cd}•{fT(ap.min)}</div><div style={{fontSize:18,color:t.ac,fontWeight:600}}>€{ap.pr[0]}–€{ap.pr[1]}</div>{ap.cd.startsWith("BTS")&&<div style={{fontSize:7,color:t.dn}}>+{fE(AB)} transfer</div>}</button>)}

                                <span style={{fontSize:32}}>{d.em} <span style={{fontWeight:600,fontSize:19,color:t.w}}>{d.nm}</span></span>
                                <span style={{fontSize:8,color:t.ac,fontWeight:600}}>{km}km</span>
                              </div>
                              <div style={{fontSize:8,color:t.tm,marginTop:2}}>~{fT(dMin(km,transport))} from {dest.nm.split(" ")[0]}</div>
                            </button>

                        </div>
                        {s2Near.length===0&&<div style={{textAlign:"center",fontSize:19,color:t.td,padding:12}}>No nearby stops for this destination.</div>}
                      </div>

                      <div style={{fontSize:8,color:t.tm,marginTop:2}}>Transfer: ~{interKm}km • {fT(interMin)} by {transport}</div>
                    </div>
                    <button onClick={resetS2} style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"12px 8px",color:t.dn,cursor:"pointer",fontSize:18}}>✕ Remove</button>
                  </div>
                )}
              </div>

            {step>=2&&(
              <div style={{marginBottom:14}}>
                <div style={{fontSize:19,color:t.ac,letterSpacing:2,textTransform:"uppercase",marginBottom:14,fontWeight:600}}>Step 2 — {multi?"Nights per Stop":"How Many Nights?"}</div>
                {recNights>0&&<div style={{background:t.db,border:`1px solid ${t.dn}18`,borderRadius:13,padding:7,marginBottom:7,fontSize:18,color:t.dn,lineHeight:1.4}}>⚠️ Total travel ~{fT(trvMin+(multi?interMin+retMin:0))} — at least {recNights} night{recNights>1?"s":""} recommended</div>}
                {multi?(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <div>
                      <div style={{fontSize:18,color:t.tm,marginBottom:4,fontWeight:600}}>{dest.em} {dest.nm}</div>
                      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
                        {[0,1,2,3].map(n=><button key={n} onClick={()=>{setNights(n);if(step<3)setStep(3);}} style={{width:44,height:44,borderRadius:14,background:nights===n?t.ab:t.cd,border:nights===n?`2px solid ${t.ac}`:`1px solid ${t.cb}`,color:nights===n?t.ac:t.tm,fontWeight:700,fontSize:18,cursor:"pointer"}}>{n}</button>)}

                      <div style={{textAlign:"center",fontSize:8,color:t.td,marginTop:3}}>{nights===0?"pass through":`${nights}nt ~${fE(dest.htl*nights)}`}</div>

                      <div style={{fontSize:18,color:t.tm,marginBottom:4,fontWeight:600}}>{stop2.em} {stop2.nm}</div>
                      <div style={{display:"flex",gap:12,justifyContent:"center"}}>
                        {[0,1,2,3].map(n=><button key={n} onClick={()=>{setS2Nt(n);if(step<3)setStep(3);}} style={{width:44,height:44,borderRadius:14,background:s2Nt===n?t.ab:t.cd,border:s2Nt===n?`2px solid ${t.ac}`:`1px solid ${t.cb}`,color:s2Nt===n?t.ac:t.tm,fontWeight:700,fontSize:18,cursor:"pointer"}}>{n}</button>)}

                      <div style={{textAlign:"center",fontSize:8,color:t.td,marginTop:3}}>{s2Nt===0?"pass through":`${s2Nt}nt ~${fE(stop2.htl*s2Nt)}`}</div>

                <div style={{fontSize:19,color:t.ac,letterSpacing:2,textTransform:"uppercase",marginBottom:14,fontWeight:600}}>Step 3 — Wellness</div>
                {multi?(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
                    <div>
                      <div style={{fontSize:18,color:t.tm,marginBottom:4}}>{dest.em} {dest.nm}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                        <button onClick={()=>{setWantWell(true);if(step<4)setStep(4);}} style={{...bs,background:wantWell===true?t.tb:t.cd,border:wantWell===true?`2px solid ${t.tl}`:`1px solid ${t.cb}`,borderRadius:13,padding:6,textAlign:"center"}}><div style={{fontSize:19,color:t.w}}>🧖 Yes</div><div style={{fontSize:8,color:t.tm}}>{dest.well>0?fE(dest.well):"-"}</div></button>
                        <button onClick={()=>{setWantWell(false);if(step<4)setStep(4);}} style={{...bs,background:wantWell===false?t.ab:t.cd,border:wantWell===false?`2px solid ${t.ac}`:`1px solid ${t.cb}`,borderRadius:13,padding:6,textAlign:"center"}}><div style={{fontSize:19,color:t.w}}>Skip</div></button>
                      </div>
                    </div>
                    <div>
                      <div style={{fontSize:18,color:t.tm,marginBottom:4}}>{stop2.em} {stop2.nm}</div>
                      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:4}}>
                        <button onClick={()=>{setS2Well(true);if(step<4)setStep(4);}} style={{...bs,background:s2Well?t.tb:t.cd,border:s2Well?`2px solid ${t.tl}`:`1px solid ${t.cb}`,borderRadius:13,padding:6,textAlign:"center"}}><div style={{fontSize:19,color:t.w}}>🧖 Yes</div><div style={{fontSize:8,color:t.tm}}>{stop2.well>0?fE(stop2.well):"-"}</div></button>
                        <button onClick={()=>{setS2Well(false);if(step<4)setStep(4);}} style={{...bs,background:!s2Well?t.ab:t.cd,border:!s2Well?`2px solid ${t.ac}`:`1px solid ${t.cb}`,borderRadius:13,padding:6,textAlign:"center"}}><div style={{fontSize:19,color:t.w}}>Skip</div></button>
                      </div>
                    </div>
                  </div>
                ):(
                  <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10}}>
                    <button onClick={()=>pickWell(true)} style={{...bs,background:wantWell===true?t.tb:t.cd,border:wantWell===true?`2px solid ${t.tl}`:`1px solid ${t.cb}`,borderRadius:14,padding:9}}><div style={{fontWeight:600,fontSize:32,color:t.w}}>🧖 Yes</div><div style={{fontSize:18,color:t.tm,marginTop:2}}>{dest.well>0?`~${fE(dest.well)}/pp`:"Limited"}</div></button>
                    <button onClick={()=>pickWell(false)} style={{...bs,background:wantWell===false?t.ab:t.cd,border:wantWell===false?`2px solid ${t.ac}`:`1px solid ${t.cb}`,borderRadius:14,padding:9}}><div style={{fontWeight:600,fontSize:32,color:t.w}}>🚶 Skip</div><div style={{fontSize:18,color:t.tm,marginTop:2}}>Sightsee instead</div></button>
                  </div>
                )}
              </div>
            )}

            {step>=4&&costs&&(
              <div>
                <div style={{fontSize:19,color:t.ac,letterSpacing:2,textTransform:"uppercase",marginBottom:14,fontWeight:600}}>Step 4 — Budget & Add-ons</div>
                <div style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"12px 11px",marginBottom:12}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:3}}>
                    <span style={{fontSize:19,color:t.tm}}>🍽️ Meals/person/day</span>
                    <span style={{fontSize:19,color:t.ac,fontWeight:700}}>{fE(meal)}</span>
                  </div>
                  <input type="range" min={10} max={80} step={5} value={meal} onChange={e=>setMeal(+e.target.value)} style={{width:"100%",accentColor:t.ac}}/>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:7,color:t.td}}><span>€10 budget</span><span>€35 mid</span><span>€80 fine</span></div>
                </div>
                {dest.at.length>0&&(
                  <div style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"12px 11px",marginBottom:12}}>
                    <div style={{fontSize:19,color:t.tm,marginBottom:12,fontWeight:600}}>🎫 {multi?`${dest.nm} — `:""}Attractions (per person)</div>
                    {dest.at.map((a,i)=><button key={i} onClick={()=>togAt(i)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:selAt.includes(i)?t.tb:"transparent",border:`1px solid ${selAt.includes(i)?t.tl:t.cb}`,borderRadius:14,padding:"12px 9px",marginBottom:3,cursor:"pointer",color:t.tx,textAlign:"left"}}><span style={{fontSize:19}}>{selAt.includes(i)?"✓ ":"○ "}{a.n}</span><span style={{fontSize:19,fontWeight:600,color:a.p?t.ac:t.tl}}>{a.p?fE(a.p):"free"}</span></button>)}
                  </div>

                {multi&&stop2.at.length>0&&(
                  <div style={{background:`${t.tl}04`,border:`1px solid ${t.tl}20`,borderRadius:14,padding:"12px 11px",marginBottom:12}}>
                    <div style={{fontSize:19,color:t.tl,marginBottom:12,fontWeight:600}}>🎫 {stop2.nm} — Attractions (per person)</div>
                    {stop2.at.map((a,i)=><button key={i} onClick={()=>togS2At(i)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:s2At.includes(i)?t.tb:"transparent",border:`1px solid ${s2At.includes(i)?t.tl:t.cb}`,borderRadius:14,padding:"12px 9px",marginBottom:3,cursor:"pointer",color:t.tx,textAlign:"left"}}><span style={{fontSize:19}}>{s2At.includes(i)?"✓ ":"○ "}{a.n}</span><span style={{fontSize:19,fontWeight:600,color:a.p?t.ac:t.tl}}>{a.p?fE(a.p):"free"}</span></button>)}
                  </div>
                )}
                {dest.loc&&<button onClick={()=>setWantLoc(!wantLoc)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:wantLoc?t.tb:t.cd,border:`1px solid ${wantLoc?t.tl:t.cb}`,borderRadius:14,padding:"12px 11px",marginBottom:4,cursor:"pointer",color:t.tx,textAlign:"left"}}><span style={{fontSize:19}}>{wantLoc?"✓":"○"} 🚇 {multi?`${dest.nm}: `:""}{dest.loc.n}</span><span style={{fontSize:19,fontWeight:600,color:t.ac}}>{fE(dest.loc.p)}/pp/day</span></button>}
                {multi&&stop2.loc&&<button onClick={()=>setS2Loc(!s2Loc)} style={{display:"flex",justifyContent:"space-between",alignItems:"center",width:"100%",background:s2Loc?t.tb:t.cd,border:`1px solid ${s2Loc?t.tl:t.cb}`,borderRadius:14,padding:"12px 11px",marginBottom:12,cursor:"pointer",color:t.tx,textAlign:"left"}}><span style={{fontSize:19}}>{s2Loc?"✓":"○"} 🚇 {stop2.nm}: {stop2.loc.n}</span><span style={{fontSize:19,fontWeight:600,color:t.ac}}>{fE(stop2.loc.p)}/pp/day</span></button>}

                <div style={{background:`${t.tl}08`,border:`1px solid ${t.tl}20`,borderRadius:13,padding:"10px 12px",marginBottom:multi?6:10}}>
                  <div style={{fontSize:19,color:t.tl,marginBottom:14,fontWeight:700}}>📋 {multi?`${dest.nm} — `:""} Day Itinerary</div>
                  {[{icon:"☀️",label:"Morning",text:dest.it.am},{icon:"🌤️",label:"Afternoon",text:dest.it.pm},{icon:"🌙",label:"Evening",text:dest.it.ev}].map((s,i)=>(
                    <div key={i} style={{display:"flex",gap:12,marginBottom:i<2?6:0,alignItems:"flex-start"}}>
                      <span style={{fontSize:18,flexShrink:0,marginTop:1}}>{s.icon}</span>
                      <div><div style={{fontSize:18,fontWeight:600,color:t.ac,marginBottom:1}}>{s.label}</div><div style={{fontSize:19,color:t.tx,lineHeight:1.4}}>{s.text}</div></div>
                    </div>
                  ))}
                </div>
                {multi&&(
                  <div style={{background:`${t.tl}08`,border:`1px solid ${t.tl}20`,borderRadius:13,padding:"10px 12px",marginBottom:14}}>
                    <div style={{fontSize:19,color:t.tl,marginBottom:14,fontWeight:700}}>📋 {stop2.nm} — Day Itinerary</div>
                    {[{icon:"☀️",label:"Morning",text:stop2.it.am},{icon:"🌤️",label:"Afternoon",text:stop2.it.pm},{icon:"🌙",label:"Evening",text:stop2.it.ev}].map((s,i)=>(
                      <div key={i} style={{display:"flex",gap:12,marginBottom:i<2?6:0,alignItems:"flex-start"}}>
                        <span style={{fontSize:18,flexShrink:0,marginTop:1}}>{s.icon}</span>
                        <div><div style={{fontSize:18,fontWeight:600,color:t.ac,marginBottom:1}}>{s.label}</div><div style={{fontSize:19,color:t.tx,lineHeight:1.4}}>{s.text}</div></div>
                      </div>
                    ))}
                  </div>
                )}
                {tlSegs.length>0&&(
                  <div style={{background:`${t.ac}06`,border:`1px solid ${t.ac}15`,borderRadius:13,padding:"12px 4px 8px",marginBottom:14,overflow:"hidden"}}>
                    <div style={{fontSize:18,color:t.ac,marginBottom:14,fontWeight:700,textAlign:"center",letterSpacing:1}}>🗓️ TRIP TIMELINE</div>
                    <div style={{display:"flex",alignItems:"flex-start",padding:"0 2px",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
                      {tlSegs.flatMap((s,i)=>{
                        const items=[];
                        if(i>0)items.push(<div key={`l${i}`} style={{flex:1,minWidth:12,height:3,marginTop:11,borderRadius:2,background:`linear-gradient(90deg,${t.tl}30,${t.ac}70,${t.tl}30)`,backgroundSize:"200% 100%",animation:"tlSweep 2.5s linear infinite",animationDelay:`${i*0.3}s`}}/>);
                        items.push(<div key={`n${i}`} style={{textAlign:"center",minWidth:32,flexShrink:0}}>
                          <div style={{width:30,height:30,margin:"0 auto",borderRadius:"50%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:32,background:`${i===0||i===tlSegs.length-1?t.ac:t.tl}15`,animation:`tlPop 2.5s ease-in-out infinite`,animationDelay:`${i*0.4}s`}}>{s.icon}</div>
                          <div style={{fontSize:6,color:t.w,fontWeight:600,marginTop:3,lineHeight:1.2,whiteSpace:"nowrap"}}>{s.lb}</div>
                          <div style={{fontSize:5,color:t.td,marginTop:1}}>{s.sub}</div>
                        </div>);
                        return items;
                      })}
                    </div>
                    <div style={{textAlign:"center",marginTop:8,fontSize:8,color:t.td}}>
                      {multi?`Route: Vienna → ${dest.nm} → ${stop2.nm} → Vienna`:transport==="train"?`Train ~${fE(costs.trnC)} return`:transport==="car"?`${costs.routeKm}km total route`:""}
                    </div>
                  </div>
                )}
                <div style={{background:`linear-gradient(135deg,${t.tl}06 0%,${t.ac}06 100%)`,border:`1px solid ${t.ac}28`,borderRadius:13,padding:18,marginBottom:14}}>
                  <div style={{fontSize:19,color:t.ac,letterSpacing:2,textTransform:"uppercase",marginBottom:12,fontWeight:600}}>💰 Cost Breakdown • {totalDays}d/{totalNt}n{multi?" • multi-stop":""}</div>
                  <div style={{marginBottom:7}}>
                    <div style={{fontSize:19,color:t.tm,marginBottom:3,fontWeight:600}}>{transport==="train"?"🚂 Train":transport==="car"?"🚗 Car":transport==="flixbus"?"🚌 FlixBus":`✈️ ${selFl?.al}`}</div>
                    {transport==="train"&&<>{multi?<><R t={t} label={`${dest.nm} ticket (${people}×)`} sub={dest.trp?`avg €${Math.round((dest.trp[0]+dest.trp[1])/2)}`:""} value={dest.trp?fE((dest.trp[0]+dest.trp[1])/2*people):"—"}/><R t={t} label={`${dest.nm}→${stop2.nm} (~${interKm}km)`} value={fE(Math.round(interKm*0.08)*people)}/><R t={t} label={`${stop2.nm}→Vienna (${people}×)`} sub={stop2.trp?`avg €${Math.round((stop2.trp[0]+stop2.trp[1])/2)}`:""} value={stop2.trp?fE((stop2.trp[0]+stop2.trp[1])/2*people):"—"}/></>:<R t={t} label={`Return ticket (${people}× RT)`} sub={dest.trp?`avg €${Math.round((dest.trp[0]+dest.trp[1])/2)}×2×${people}`:""} value={fE(costs.trnC)}/>}</>}
                    {transport==="car"&&<><R t={t} label={`Fuel (${costs.routeKm}km${multi?" route":""})`} value={fE(costs.fuel)}/><R t={t} label="Parking" value={fE(costs.park)}/>{costs.toll>0&&<R t={t} label="Tolls" value={fE(costs.toll)}/>}</>}
                    {transport==="flight"&&selFl&&<><R t={t} label={`${selFl.cd} (${people}× RT)`} sub={`avg €${Math.round((selFl.pr[0]+selFl.pr[1])/2)}×2×${people}`} value={fE(costs.flC)}/><R t={t} label="Airport transfer (RT)" value={fE(costs.aptT)}/></>}
                    {transport==="flixbus"&&<R t={t} label={multi?`3 legs × ${people}pp`:`${people}× return`} value={fE(costs.fxC)}/>}
                    {multi&&transport!=="train"&&<R t={t} label={`↳ incl. ${dest.nm}→${stop2.nm} ~${interKm}km`} value="" sub={fT(interMin)}/>}
                    <R t={t} label="Transport" value={costs.trT===0?"FREE":fE(costs.trT)} bold/>
                  </div>
                  <div style={{borderTop:`1px solid ${t.cb}`,margin:"4px 0"}}/>
                  {(nights>0||(multi&&s2Nt>0))&&<><div style={{marginBottom:7}}><div style={{fontSize:19,color:t.tm,marginBottom:2,fontWeight:600}}>🏨 Hotels</div>
                    {nights>0&&<R t={t} label={`${multi?dest.nm+": ":""}${nights}nt × ${fE(dest.htl)}`} value={fE(dest.htl*nights)}/>}
                    {multi&&s2Nt>0&&<R t={t} label={`${stop2.nm}: ${s2Nt}nt × ${fE(stop2.htl)}`} value={fE(stop2.htl*s2Nt)}/>}
                    <R t={t} label="Hotel total" value={fE(costs.htl)} bold/>
                  </div><div style={{borderTop:`1px solid ${t.cb}`,margin:"4px 0"}}/></>}
                  {costs.well>0&&<><div style={{marginBottom:7}}><div style={{fontSize:19,color:t.tm,marginBottom:2,fontWeight:600}}>🧖 Wellness</div>
                    {wantWell&&<R t={t} label={`${multi?dest.nm+": ":""}${people}×${fE(dest.well)}`} value={fE(dest.well*people)}/>}
                    {multi&&s2Well&&<R t={t} label={`${stop2.nm}: ${people}×${fE(stop2.well)}`} value={fE(stop2.well*people)}/>}
                  </div><div style={{borderTop:`1px solid ${t.cb}`,margin:"4px 0"}}/></>}
                  <div style={{marginBottom:7}}><div style={{fontSize:19,color:t.tm,marginBottom:2,fontWeight:600}}>🍽️ Meals</div><R t={t} label={`${people}×${fE(meal)}×${totalDays}d`} value={fE(costs.mls)}/></div>
                  {(costs.atC>0||costs.at2C>0)&&<><div style={{borderTop:`1px solid ${t.cb}`,margin:"4px 0"}}/><div style={{marginBottom:7}}><div style={{fontSize:19,color:t.tm,marginBottom:2,fontWeight:600}}>🎫 Attractions</div>
                    {selAt.map(i=><R key={`a${i}`} t={t} label={`${multi?dest.nm+": ":""}${dest.at[i].n}`} value={dest.at[i].p?`${fE(dest.at[i].p)}×${people}`:"free"}/>)}
                    {multi&&s2At.map(i=><R key={`b${i}`} t={t} label={`${stop2.nm}: ${stop2.at[i].n}`} value={stop2.at[i].p?`${fE(stop2.at[i].p)}×${people}`:"free"}/>)}
                    <R t={t} label="Attractions total" value={fE(costs.atC+costs.at2C)} bold/>
                  </div></>}
                  {(costs.locC>0||costs.loc2C>0)&&<><div style={{borderTop:`1px solid ${t.cb}`,margin:"4px 0"}}/><div style={{marginBottom:7}}><div style={{fontSize:19,color:t.tm,marginBottom:2,fontWeight:600}}>🚇 Local Transport</div>
                    {costs.locC>0&&<R t={t} label={`${multi?dest.nm+": ":""}${dest.loc.n}`} value={fE(costs.locC)}/>}
                    {costs.loc2C>0&&<R t={t} label={`${stop2.nm}: ${stop2.loc.n}`} value={fE(costs.loc2C)}/>}
                  </div></>}
                  <div style={{borderTop:`2px solid ${t.ac}28`,margin:"7px 0"}}/>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}><span style={{fontSize:19,fontWeight:700,color:t.w}}>TOTAL</span><span style={{fontSize:26,fontWeight:800,color:t.ac}}>{fE(costs.total)}</span></div>
                  {people>1&&<div style={{textAlign:"right",fontSize:18,color:t.tm}}>≈ {fE(costs.total/people)} per person</div>}
                </div>
                <div style={{display:"flex",flexDirection:"column",gap:4,marginBottom:14}}>
                  {transport==="car"&&dest.trn<999&&dest.trp&&<div style={{background:t.tb,borderRadius:14,padding:7,fontSize:18,color:t.tl,lineHeight:1.4}}>💡 Train: €{dest.trp[0]}–{dest.trp[1]} one-way (saves fuel) — FREE with Klimaticket (€1,095/yr)</div>}
                  {transport==="car"&&dest.fx&&<div style={{background:"rgba(67,181,129,0.05)",borderRadius:14,padding:7,fontSize:18,color:"#43b581",lineHeight:1.4}}>🚌 FlixBus €{dest.fx.pr[0]}–{dest.fx.pr[1]} — flixbus.com</div>}
                  {multi&&transport==="flixbus"&&<div style={{background:"rgba(67,181,129,0.05)",borderRadius:14,padding:7,fontSize:18,color:"#43b581",lineHeight:1.4}}>💡 Check flixbus.com for {dest.nm}→{stop2.nm} route availability</div>}
                  {transport==="flight"&&selFl&&!selFl.cd.startsWith("BTS")&&dest.fl?.ap.some(a=>a.cd.startsWith("BTS"))&&<div style={{background:`${t.pu}06`,borderRadius:14,padding:7,fontSize:18,color:t.pu,lineHeight:1.4}}>💡 BTS often cheaper — lower taxes</div>}
                  {transport==="flight"&&<div style={{background:`${t.bl}05`,borderRadius:14,padding:7,fontSize:18,color:t.bl,lineHeight:1.4}}>🔗 {selFl?.al==="Ryanair"?"ryanair.com":"wizzair.com"} — book 4-6 weeks ahead</div>}
                </div>
                <div style={{display:"flex",justifyContent:"center",gap:12}}>
                  <button onClick={doExport} style={{background:copied?t.tb:t.cd,border:`1px solid ${copied?t.tl:t.cb}`,borderRadius:14,padding:"11px 16px",color:copied?t.tl:t.tm,cursor:"pointer",fontSize:19,fontWeight:600,transition:"all 0.3s"}}>{copied?"✓ Copied!":"📋 Export"}</button>
                  <button onClick={doTelegram} style={{background:`${t.bl}12`,border:`1px solid ${t.bl}40`,borderRadius:14,padding:"11px 16px",color:t.bl,cursor:"pointer",fontSize:19,fontWeight:600}}>✈️ Telegram</button>
                  <button onClick={reset} style={{background:t.cd,border:`1px solid ${t.cb}`,borderRadius:14,padding:"11px 16px",color:t.tm,cursor:"pointer",fontSize:19,fontWeight:600}}>🗺️ New Trip</button>
                </div>
              </div>
            )}
          </div>
        )}

        <div style={{textAlign:"center",marginTop:20,fontSize:7,color:t.td,lineHeight:1.7}}>
          Fuel €0.12/km • Flights = estimates • Hotels booking.com avg • FlixBus prices vary • {D.length} destinations<br/>
          Multi-stop uses haversine ×1.3 road estimates • BTS = Bratislava (60min) • ⚠️ Wizzair VIE closed Mar'26
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<TripPlanner/>);
</script>
</body>
</html>
